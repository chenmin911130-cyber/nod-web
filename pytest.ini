[pytest]
# A worker thread that dies mid-answer skips its own cleanup, so the client
# never gets done/error and the UI sticks on Waiting. Keep these fatal.
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning
    error::pytest.PytestUnraisableExceptionWarning
# `server` is a plain package (no setup.py/build), so pytest needs the repo
# root on sys.path to import it. Without this, `pytest` collects 0 and
# errors with "No module named 'server'"; `python -m pytest` works because
# the current dir is on the path. This makes plain `pytest` work too.
pythonpath = .
